* {

}

:root {
    --navy: #102a56;
    --blue: #2563eb;
    --light-blue: #eff6ff;
    --yellow: #facc15;
    --text: #1e293b;
    --muted: #64748b;

body {

    background: #f8fafc;
    color: var(--text);
    line-height: 1.6;
}

/* NAVIGASI */

header {
    background: white;
    padding: 15px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    color: var(--navy);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.logo span {
    color: var(--blue);
}

nav {
    display: flex;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
}

nav a {
    color: #475569;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: .2s;
}

nav a:hover {
    color: var(--blue);
}

/* HERO */

.hero {
    background: linear-gradient(115deg, #102a56, #1d4ed8);

}

.hero-content {
    max-width: 850px;
}

.hero-label {

}

.hero h1 {

    font-weight: 800;

}

.hero h1 span {
    color: var(--yellow);
}

.hero p {
    color: #dbeafe;
    max-width: 700px;
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.btn-primary {
    display: inline-block;
    background: var(--yellow);
    color: var(--navy);
    padding: 12px 24px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    transition: .2s;
}

.btn-primary:hover {

}

/* INFORMASI SINGKAT */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

}

.stat-item {
    border-right: 1px solid #e2e8f0;
}

.stat-item:last-child {
    border-right: none;
}

.stat-item h3 {
    color: var(--blue);
    font-size: 23px;
    font-weight: 800;
}

.stat-item p {
    color: var(--muted);
    font-size: 13px;
}

/* SECTION */

section {
    padding: 48px 7%;
}

.section-heading {
    margin-bottom: 25px;
}

.section-heading h2 {
    color: var(--navy);
    font-size: 27px;
    margin-bottom: 5px;
}

.section-heading p {
    color: var(--muted);
    font-size: 14px;
}

/* KARTU KELAS */

.class-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.class-card {

    transition: .25s;
}

.class-card:hover {

}

    font-weight: 800;
    margin-bottom: 17px;
}

.class-card h3 {
    color: var(--navy);

.class-card p {
    color: var(--muted);
    font-size: 14px;
    min-height: 65px;
    margin-bottom: 15px;
}

.class-card a {
    color: var(--blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
}

/* FITUR */

.feature-section {
    background: #eff6ff;
}

.feature-icon {

.feature-card p {

}

.feature-card a {
    color: var(--blue);

    font-weight: 700;
    font-size: 13px;
}

/* INFORMASI */

.about {
    background: white;
    text-align: center;
}

.about h2 {
    color: var(--navy);
    font-size: 26px;
    margin-bottom: 12px;
}

.about p {
    max-width: 750px;
    margin: auto;
    color: var(--muted);

}

/* FOOTER */

footer {
    background: var(--navy);
    color: white;
    padding: 27px 7%;
    text-align: center;
}

footer h3 {
    font-size: 17px;
    margin-bottom: 5px;
}

footer p {
    color: #cbd5e1;
    font-size: 12px;
}

/* RESPONSIVE */

    header {
        justify-content: center;
    }

    nav {
        justify-content: center;

    }

    .stats {
        margin-left: 5%;
        margin-right: 5%;
    }

    section {
        padding: 38px 6%;
    }
}
